<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 · 页面走丢了</title>
<meta name="theme-color" content="#0b0d10">
<style>
  :root{--bg:#0b0d10;--ink:#eef1f5;--ink-2:#9aa3ae;--accent:#6ee7b7}
  @media (prefers-color-scheme: light){:root{--bg:#fbfbfa;--ink:#14161a;--ink-2:#5a616b;--accent:#0f9d68}}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);display:grid;place-items:center;
    font:16px/1.7 -apple-system,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif}
  .box{max-width:440px;padding:0 28px;text-align:center}
  .code{font-size:76px;font-weight:720;letter-spacing:-.055em;line-height:1;margin-bottom:18px;
    font-variant-numeric:tabular-nums}
  .code span{color:var(--accent)}
  p{color:var(--ink-2);margin:0 0 26px}
  a{color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}
</style>
</head>
<body>
  <div class="box">
    <div class="code"><span>4</span>0<span>4</span></div>
    <p>这个地址没有东西。可能是链接过期了，也可能是我还没写出那个页面。</p>
    <a href="/">回到首页</a>
  </div>
</body>
</html>
